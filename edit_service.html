<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Service</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body{
    background:#f4f7fc;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,.1);
}

.card-header{
    background:#2563eb;
    color:white;
    font-size:22px;
    font-weight:bold;
    border-radius:15px 15px 0 0!important;
}

.btn-primary{
    background:#2563eb;
}

.btn-secondary{
    margin-left:10px;
}
</style>
</head>
<body>
<div class="container mt-5">
<div class="row justify-content-center">
<div class="col-md-8">
<div class="card">
<div class="card-header">
<i class="bi bi-pencil-square"></i>
Edit Service
</div>
<div class="card-body">
<form action="/update_service/{{ service.id }}" method="POST">
<div class="mb-3">
<label class="form-label">Service Name</label>
<input
type="text"
class="form-control"
name="service_name"
value="{{ service.service_name }}"
required>
</div>
<div class="mb-3">
<label class="form-label">Category</label>
<select
class="form-select"
name="category"
required>
<option value="Electrician"
{% if service.category=="Electrician" %}selected{% endif %}>
Electrician
</option>
<option value="Plumber"
{% if service.category=="Plumber" %}selected{% endif %}>
Plumber
</option>
<option value="Carpenter"
{% if service.category=="Carpenter" %}selected{% endif %}>
Carpenter
</option>
<option value="Painter"
{% if service.category=="Painter" %}selected{% endif %}>
Painter
</option>
<option value="Cleaner"
{% if service.category=="Cleaner" %}selected{% endif %}>
Cleaner
</option>
<option value="Mechanic"
{% if service.category=="Mechanic" %}selected{% endif %}>
Mechanic
</option>
</select>
</div>
<div class="mb-3">
<label class="form-label">Price (Rs.)</label>
<input
type="number"
class="form-control"
name="price"
value="{{ service.price }}"
required>
</div>
<div class="mb-3">
<label class="form-label">Description</label>
<textarea
class="form-control"
name="description"
rows="5"
required>{{ service.description }}</textarea>
</div>
<button class="btn btn-primary">
<i class="bi bi-save"></i>
Update Service
</button>
<a href="/my_services" class="btn btn-secondary">
Back
</a>
</form>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
